# Exclusiones del escaneo de secretos de GitHub.
#
# guardian_sombras es un detector de credenciales. Su suite de pruebas
# contiene, por necesidad, cadenas con la forma exacta de los secretos que
# debe reconocer: claves de ejemplo públicas y documentadas (AWS
# AKIAIOSFODNN7EXAMPLE), alfabetos en orden y valores manifiestamente
# inventados. Ninguna es una credencial real ni ha estado activa.
#
# Sin esta exclusión, el escáner marca los propios casos de prueba del
# detector, lo que genera avisos que enmascararían un hallazgo verdadero.
paths-ignore:
  - "guardian_sombras/tests/**"
  - "guardian_sombras/idea.txt"
