[modo]
nombre = "dev"
descripcion = "Sesion de desarrollo — Opera, terminal + YouTube, Discord + WhatsApp"

# Pantalla 1: Opera
[[apps]]
comando = "opera"
workspace = 1
delay = 2

# Pantalla 2: Terminal
[[apps]]
comando = "alacritty"
