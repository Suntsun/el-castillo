# Manifiesto del Jefe de Maquinas
# Esquema: ver ~/Escritorio/automatizaciones/el_arquitecto_del_castillo/docs/esquema_manifiesto.md
#
# El comando base 'castillo' usa FLAGS, no subcomandos.
# Operaciones expuestas de LECTURA: dashboard (sin flags, default),
#   servicios (--servicios), resumen (--resumen), logs (--logs AUTO [--lineas N]).
# Operaciones de ESCRITURA_SISTEMA (con confirmacion): ejecutar (--ejecutar AUTO),
#   parar (--parar SERVICIO), arrancar (--arrancar SERVICIO).
# Se omite el flujo de dashboard interactivo prolongado: el dashboard es de una pasada.

[meta]
clave = "jefe_de_maquinas"
nombre_visible = "Jefe de Maquinas"
descripcion_corta = "Orquestador central: muestra estado del ecosistema, gestiona servicios systemd y lanza automatizaciones"
categoria = "monitorizacion"
version_manifiesto = "1.0.0"

[invocacion]
comando_base = "castillo"
tipo = "wrapper_cli"
usa_subcomandos = false

[[operaciones]]
nombre = "dashboard"
descripcion = "Muestra el dashboard completo del ecosistema: servicios activos, automatizaciones, pendientes y errores recientes de 24h."
flags = []
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "servicios"
descripcion = "Muestra el estado de los timers y daemons systemd del usuario vinculados al ecosistema."
flags = ["--servicios"]
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "resumen"
descripcion = "Genera un resumen corto del ecosistema (automatizaciones, servicios, errores) y envia una notificacion de escritorio."
flags = ["--resumen"]
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_corto"

[[operaciones]]
nombre = "ver_logs"
descripcion = "Muestra las ultimas lineas del log de una automatizacion concreta. Opcionalmente se indica el numero de lineas."
flags = []
argumentos_aceptados = ["auto_logs", "lineas"]
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "ejecutar_automatizacion"
descripcion = "Ejecuta manualmente el script principal de una automatizacion del ecosistema (lanza un subproceso Python)."
flags = []
argumentos_aceptados = ["auto_ejecutar"]
requiere_confirmacion = true
peligrosidad = "escritura_sistema"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "parar_servicio"
descripcion = "Para un servicio o timer systemd del usuario (systemctl --user stop)."
flags = []
argumentos_aceptados = ["servicio_parar"]
requiere_confirmacion = true
peligrosidad = "escritura_sistema"
bloquea_terminal = false
salida_esperada = "texto_corto"

[[operaciones]]
nombre = "arrancar_servicio"
descripcion = "Arranca un servicio o timer systemd del usuario (systemctl --user start)."
flags = []
argumentos_aceptados = ["servicio_arrancar"]
requiere_confirmacion = true
peligrosidad = "escritura_sistema"
bloquea_terminal = false
salida_esperada = "texto_corto"

[seguridad]
permite_argumentos_libres = false
requiere_red = false
requiere_sudo = false
tiempo_max_segundos = 150
paths_protegidos = []

[[argumentos]]
clave = "auto_logs"
descripcion = "Nombre de la automatizacion cuyo log se quiere consultar (nombre de la carpeta)."
tipo = "cadena"
obligatorio = true
regex = "^[a-z][a-z0-9_]*$"
forma_paso = "flag_largo"
flag_literal = "--logs"

[[argumentos]]
clave = "lineas"
descripcion = "Numero de lineas del log a mostrar (se usa junto con --logs)."
tipo = "entero"
obligatorio = false
valor_por_defecto = "30"
min = 1
max = 1000
forma_paso = "flag_largo"
flag_literal = "--lineas"

[[argumentos]]
clave = "auto_ejecutar"
descripcion = "Nombre de la automatizacion a ejecutar manualmente (nombre de la carpeta)."
tipo = "cadena"
obligatorio = true
regex = "^[a-z][a-z0-9_]*$"
forma_paso = "flag_largo"
flag_literal = "--ejecutar"

[[argumentos]]
clave = "servicio_parar"
descripcion = "Nombre del servicio o timer systemd del usuario a parar (con o sin extension .service/.timer)."
tipo = "cadena"
obligatorio = true
regex = "^[a-z][a-z0-9_]*$"
forma_paso = "flag_largo"
flag_literal = "--parar"

[[argumentos]]
clave = "servicio_arrancar"
descripcion = "Nombre del servicio o timer systemd del usuario a arrancar (con o sin extension .service/.timer)."
tipo = "cadena"
obligatorio = true
regex = "^[a-z][a-z0-9_]*$"
forma_paso = "flag_largo"
flag_literal = "--arrancar"

[dependencias]
binarios = ["python3", "systemctl", "notify-send"]
paquetes_python = []
ficheros_config = [
    "~/Escritorio/automatizaciones/jefe_de_maquinas/config.toml",
]
servicios_systemd = []

[contexto_llm]
cuando_usar = "Cuando el usuario quiere ver el estado general del Castillo, gestionar servicios o timers systemd, consultar logs de una automatizacion o lanzar una automatizacion manualmente."
cuando_no_usar = "Cuando el usuario pregunta solo por errores agregados (eso es el Cronista de Errores) o quiere seguir un log en tiempo real."
ejemplos_peticion = [
    "dame el estado del castillo",
    "que servicios estan corriendo",
    "para el timer de tejedor_entorno",
    "ejecuta el limpiador ahora",
    "muestrame las ultimas lineas del log del limpiador",
]
palabras_clave = ["estado", "castillo", "ecosistema", "servicios", "timer", "systemd", "ejecutar", "arrancar", "parar", "dashboard", "resumen", "logs"]
