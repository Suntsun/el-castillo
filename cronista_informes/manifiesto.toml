# Manifiesto del Cronista de Informes
# Esquema: ver /home/sun/Escritorio/automatizaciones/el_arquitecto_del_castillo/docs/esquema_manifiesto.md
#
# Operaciones expuestas: mostrar_ultimo, mostrar_semana, listar, generar.
# El script tambien corre por timer (cronista_informes.timer, dom 21:00) que
# invoca 'informe --generar'; eso lo gestiona systemd, no el Arquitecto.

[meta]
clave = "cronista_informes"
nombre_visible = "Cronista de Informes"
descripcion_corta = "Genera y muestra el informe semanal del ecosistema: actividad, errores y estado del sistema"
categoria = "monitorizacion"
version_manifiesto = "1.0.0"

[invocacion]
comando_base = "informe"
tipo = "wrapper_cli"
usa_subcomandos = false

[[operaciones]]
nombre = "mostrar_ultimo"
descripcion = "Muestra por terminal el ultimo informe semanal ya generado, con colores ANSI."
flags = []
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "mostrar_semana"
descripcion = "Muestra el informe guardado de una fecha concreta (formato YYYY-MM-DD)."
flags = ["--semana"]
argumentos_aceptados = ["fecha_semana"]
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "listar"
descripcion = "Lista los informes semanales disponibles con su fecha y tamano."
flags = ["--lista"]
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "generar"
descripcion = "Genera un informe nuevo de los ultimos 7 dias, lo guarda en disco y envia una notificacion resumen."
flags = ["--generar"]
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "escritura_local"
bloquea_terminal = false
salida_esperada = "texto_corto"

[seguridad]
permite_argumentos_libres = false
requiere_red = false
requiere_sudo = false
tiempo_max_segundos = 60
paths_protegidos = []

[[argumentos]]
clave = "fecha_semana"
descripcion = "Fecha del informe a mostrar, en formato YYYY-MM-DD (coincide con el nombre del fichero informe_<fecha>.txt)."
tipo = "cadena"
obligatorio = false
regex = "\\d{4}-\\d{2}-\\d{2}"
forma_paso = "flag_largo"
flag_literal = "--semana"

[dependencias]
binarios = ["python3", "notify-send", "systemctl"]
paquetes_python = []
ficheros_config = [
    "/home/sun/Escritorio/automatizaciones/cronista_informes/config.toml",
]
servicios_systemd = []

[contexto_llm]
cuando_usar = "Cuando el usuario pide el informe semanal, un resumen del estado del ecosistema, o quiere generar/ver el reporte de actividad y errores de las automatizaciones."
cuando_no_usar = "Cuando solo pregunta por errores concretos (eso es 'errores') o quiere seguir logs en vivo; aqui se trata del informe agregado semanal."
ejemplos_peticion = [
    "dame el informe del castillo",
    "generame el informe semanal",
    "muestrame el resumen del ecosistema",
    "que informes hay disponibles",
    "ensename el informe de la semana del 2026-05-24",
]
palabras_clave = ["informe", "informes", "resumen", "semanal", "reporte", "estado", "ecosistema"]
