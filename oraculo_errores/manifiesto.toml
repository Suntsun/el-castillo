# Manifiesto del Oraculo de Errores
# Esquema: ver /home/sun/Escritorio/automatizaciones/el_arquitecto_del_castillo/docs/esquema_manifiesto.md
#
# El script 'explicar' obtiene el texto del error con esta prioridad:
#   1. stdin (pipe)  2. ruta de fichero (argumento posicional)  3. portapapeles.
# NO acepta el texto del error como argumento posicional directo: el posicional
# es SIEMPRE una ruta de fichero. Por eso, y porque el validador del Arquitecto
# rechaza metacaracteres shell (un stacktrace con simbolos no pasaria como
# cadena), la via fiable de invocacion es por ruta de fichero o por portapapeles.
# El analisis es local (patrones + fallback a Ollama local), de ahi peligrosidad
# 'lectura' y requiere_red = false.

[meta]
clave = "oraculo_errores"
nombre_visible = "Oraculo de Errores"
descripcion_corta = "Explica stacktraces y errores con patrones conocidos y fallback a LLM local"
categoria = "monitorizacion"
version_manifiesto = "1.0.0"

[invocacion]
comando_base = "explicar"
tipo = "wrapper_cli"
usa_subcomandos = false

[[operaciones]]
nombre = "explicar_fichero"
descripcion = "Analiza el error o stacktrace contenido en un fichero de log y explica causa y posible solucion."
flags = []
argumentos_aceptados = ["ruta_log"]
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[[operaciones]]
nombre = "explicar_portapapeles"
descripcion = "Analiza el error o stacktrace que haya en el portapapeles (comportamiento por defecto sin argumentos)."
flags = ["--clipboard"]
argumentos_aceptados = []
requiere_confirmacion = false
peligrosidad = "lectura"
bloquea_terminal = false
salida_esperada = "texto_largo"

[seguridad]
permite_argumentos_libres = false
requiere_red = false
requiere_sudo = false
tiempo_max_segundos = 30
paths_protegidos = []

[[argumentos]]
clave = "ruta_log"
descripcion = "Ruta absoluta al fichero que contiene el error o stacktrace a analizar."
tipo = "ruta_fichero"
obligatorio = false
forma_paso = "posicional"

[dependencias]
binarios = ["python3", "wl-paste", "notify-send"]
paquetes_python = []
ficheros_config = [
    "/home/sun/Escritorio/automatizaciones/oraculo_errores/config.toml",
]
servicios_systemd = ["ollama.service"]

[contexto_llm]
cuando_usar = "Cuando el usuario tiene un stacktrace o mensaje de error concreto y quiere entender que significa y como arreglarlo."
cuando_no_usar = "Cuando el usuario solo quiere ver que errores hay registrados en el sistema (eso es el Cronista de Errores), no diagnosticar uno a fondo."
ejemplos_peticion = [
    "explicame este error",
    "que significa este stacktrace",
    "analiza el error del log de la aplicacion",
    "por que falla esto y como lo arreglo",
]
palabras_clave = ["error", "stacktrace", "excepcion", "explicar", "traceback", "fallo", "diagnosticar"]
