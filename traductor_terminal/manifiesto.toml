# Manifiesto del Traductor de Terminal
# Esquema: ver ~/Escritorio/automatizaciones/el_arquitecto_del_castillo/docs/esquema_manifiesto.md
#
# Operacion expuesta: traducir (texto directo como argumento posicional).
# Se OMITEN intencionadamente:
#   - El modo interactivo (-i): es un REPL que captura stdin y no debe
#     invocarse desde el Arquitecto.
#   - El modo portapapeles (-c): depende del estado del portapapeles, no
#     es una entrada controlable por argumentos.
# El comando 'trad' usa translate-shell (trans), que consulta internet:
# por eso la operacion es de peligrosidad 'red_saliente'.

[meta]
clave = "traductor_terminal"
nombre_visible = "Traductor de Terminal"
descripcion_corta = "Traduce texto al instante desde la terminal usando translate-shell"
categoria = "productividad"
version_manifiesto = "1.0.0"

[invocacion]
comando_base = "trad"
tipo = "wrapper_cli"
usa_subcomandos = false

[[operaciones]]
nombre = "traducir"
descripcion = "Traduce el texto recibido al idioma destino indicado (por defecto espanol). Consulta internet via translate-shell."
flags = []
argumentos_aceptados = ["texto", "idioma"]
requiere_confirmacion = false
peligrosidad = "red_saliente"
bloquea_terminal = false
salida_esperada = "texto_corto"

[seguridad]
permite_argumentos_libres = false
requiere_red = true
requiere_sudo = false
tiempo_max_segundos = 20
paths_protegidos = []

[[argumentos]]
clave = "texto"
descripcion = "Texto natural a traducir. Se pasa como argumento posicional (varios tokens unidos por espacio)."
tipo = "cadena"
obligatorio = true
regex = "^[\\w .,?!¿¡áéíóúñüÁÉÍÓÚÑÜ'-]+$"
forma_paso = "posicional"

[[argumentos]]
clave = "idioma"
descripcion = "Codigo ISO 639-1 del idioma destino. Si se omite, traduce al espanol."
tipo = "enum"
obligatorio = false
valor_por_defecto = "es"
valores_validos = ["es", "en", "fr", "de", "pt", "it", "ja", "ca", "gl", "eu"]
forma_paso = "flag_largo"
flag_literal = "--to"

[dependencias]
binarios = ["trans", "python3"]
paquetes_python = []
ficheros_config = [
    "~/Escritorio/automatizaciones/traductor_terminal/config.toml",
]
servicios_systemd = []

[contexto_llm]
cuando_usar = "Cuando el usuario quiere traducir una palabra o frase a otro idioma, o saber como se dice algo en otro idioma."
cuando_no_usar = "Cuando el usuario quiere traducir el contenido del portapapeles o entrar en modo interactivo (esas variantes no estan expuestas), o cuando no hay conexion a internet."
ejemplos_peticion = [
    "traduce hola al ingles",
    "como se dice gato en frances",
    "traduceme esta frase",
    "que significa serendipity en espanol",
]
palabras_clave = ["traducir", "traduce", "traduccion", "idioma", "ingles", "frances", "aleman", "como se dice"]
